seeds:
  # Sale condition codes from the assessor's sale table page
  # (https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale).
  # Code 0 is named differently in each column,
  # so it has one row for quality1 ('Arms Length') and one for quality2 ('No Code').
  - name: valid_sale_conditions
    config:
      column_types:
        id: int64
        quality1: bool
        quality2: bool
        quality: string
        description: string

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - id
              - quality1

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - id
              - quality2

    columns:
      - name: id
        data_tests:
          - not_null

      - name: quality
        data_tests:
          - unique
          - not_null

  - name: valid_grades
    config:
      column_types:
        id: int64
        grade: string
        description: string

    columns:
      - name: id
        data_tests:
          - unique
          - not_null

      - name: grade
        data_tests:
          - unique
          - not_null

  - name: valid_conditions
