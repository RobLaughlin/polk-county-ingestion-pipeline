models:
  - name: fct_sales
    description: >-
      One row per recorded sale document (book and page), from int_sales: the sale, the assessed
      values, and the measurements of the property as it was sold. Columns are renamed with
      their units (_dollars, _sf, _ft). Join building_id to dim_buildings, dp to dim_parcels,
      the dates to dim_dates, and each *_id to its code lookup.
    config:
      contract:
        enforced: true

    constraints:
      - type: primary_key
        columns: [book, pg]
        warn_unenforced: false

    data_tests:
      # Ensure (book, pg) is a unique compound key
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - book
              - pg

      # The same total checks as staging; int_sales sets totals that don't add up to NULL.
      - dbt_utils.expression_is_true:
          name: fct_sales__total_full_is_land_plus_bldg
          arguments:
            expression: "total_full_assessment_dollars = land_full_assessment_dollars + bldg_full_assessment_dollars"

      - dbt_utils.expression_is_true:
          name: fct_sales__total_living_area_is_sum_of_floors
          arguments:
            expression: "total_living_area_sf = main_living_area_sf + upper_living_area_sf + fin_attic_area_sf"

      - dbt_utils.expression_is_true:
          name: fct_sales__fin_bsmt_area_total_is_sum_of_areas
          arguments:
            expression: "fin_bsmt_area_total_sf = fin_bsmt_area1_sf + fin_bsmt_area2_sf"

    columns:
      # Keys
      - name: book
        description: "Recorder's book number for the recorded document. Book numbers rise over time. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        data_type: int64
        constraints:
          - type: not_null

      - name: pg
        description: "Recorder's page number within the book. Together, book and pg identify one recorded document. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        data_type: int64
        constraints:
          - type: not_null

      - name: dp
        description: "District/parcel number: the 14-digit property ID, e.g. 01000001000000. The first 3 digits are the district. Kept as text because leading zeros matter. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        data_type: string
        constraints:
          - type: not_null
          - type: foreign_key
            to: ref('dim_parcels')
            to_columns: [dp]
            warn_unenforced: false
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_parcels')
                field: dp
          - dbt_expectations.expect_column_value_lengths_to_equal:
              arguments:
                value: 14

      - name: building_id
        description: "The building version at this sale: a hash of dp and every building column (see the building_columns macro), so it changes whenever any of them changes. NULL when the sale has no building data. | (added in dbt)"
        data_type: string
        constraints:
          - type: foreign_key
            to: ref('dim_buildings')
            to_columns: [building_id]
            warn_unenforced: false
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_buildings')
                field: building_id

      # Sale
      - name: sale_date
        description: "Date the parties signed the deed or contract, as entered from the Declaration of Value. This is the signing date, not the recording date. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        data_type: date
        constraints:
          - type: not_null
          - type: foreign_key
            to: ref('dim_dates')
            to_columns: [date_day]
            warn_unenforced: false
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_day

      - name: initial_entry_date
        description: "Probably the date the sale was first entered into the assessor's system. It's usually a few days after sale_date. | (inferred from data)"
        data_type: date
        constraints:
          - type: foreign_key
            to: ref('dim_dates')
            to_columns: [date_day]
            warn_unenforced: false
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_day

      - name: price_dollars
        description: "Price paid for the real property only (the total paid minus any personal property), in whole dollars. Token prices such as 0, 1 or 10 are common on non-market transfers. | Renamed from price. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        data_type: int64
        constraints:
          - type: not_null

      - name: seller
        description: "Seller (grantor). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        data_type: string

      - name: buyer
        description: "Buyer (grantee). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        data_type: string

      - name: dps
        description: "Every parcel in the sale, in short form: the district, then the parcel parts without leading zeros, so 18101588000000 becomes 181/1588. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        data_type: string

      - name: gps
        description: "Every geoparcel in the sale: the same as gp for a one-parcel sale, otherwise a comma-separated list. | (inferred from data)"
        data_type: string

      - name: instrument_id
        description: "Document type: Deed or Contract. Neither the assessor nor the Iowa Department of Revenue uses contract sales for analysis. | Stored as its id in dim_instruments (set in int_sales). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        data_type: int64
        constraints:
          - type: foreign_key
            to: ref('dim_instruments')
            to_columns: [id]
            warn_unenforced: false
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_instruments')
                field: id

      - name: quality1_id
        description: "First Iowa Department of Revenue sale condition: the reason, if any, the sale isn't a normal market sale, e.g. Family or Foreclosure. Arms Length means no condition. | Stored as its id in dim_quality1_conditions (set in int_sales). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        data_type: int64
        constraints:
          - type: foreign_key
            to: ref('dim_quality1_conditions')
            to_columns: [id]
            warn_unenforced: false
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_quality1_conditions')
                field: id

      - name: quality2_id
        description: "Second sale condition, for sales with two conditions. No Code means no second condition. | Stored as its id in dim_quality2_conditions (set in int_sales). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        data_type: int64
        constraints:
          - type: foreign_key
            to: ref('dim_quality2_conditions')
            to_columns: [id]
            warn_unenforced: false
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_quality2_conditions')
                field: id

      - name: analysis_quality_id
        description: "Whether the assessor uses the sale in its own market analysis, such as comparable sales: Good means used and Bad means not used. | Stored as its id in dim_analysis_qualities (set in int_sales). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        data_type: int64
        constraints:
          - type: foreign_key
            to: ref('dim_analysis_qualities')
            to_columns: [id]
            warn_unenforced: false
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_analysis_qualities')
                field: id

      # Assessed values
      - name: land_full_assessment_dollars
        description: "Full assessed value of the land at the time of sale, in whole dollars. The value is as of January 1 of that assessment year, including Board of Review changes. | Renamed from land_full. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        data_type: int64

      - name: bldg_full_assessment_dollars
        description: "Full assessed value of the buildings at the time of sale, in whole dollars, as of January 1 of that assessment year. | Renamed from bldg_full. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        data_type: int64

      - name: total_full_assessment_dollars
        description: "Full assessed value of the land and buildings together at the time of sale, in whole dollars. It should equal land plus buildings. | Renamed from total_full. NULL when it doesn't equal land_full + bldg_full (set in int_sales). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        data_type: int64

      # Rooms and fixtures
      - name: rooms
        description: "Total number of rooms. The assessor records it but doesn't use it in valuation. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: int64

      - name: bathrooms
        description: "Full bathrooms. A three-quarter bath counts as full. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: int64

      - name: bedrooms
        description: "Bedrooms above the basement, each at least 80 sq ft with a closet. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: int64

      - name: toilet_rooms
        description: "Half baths (a toilet and sink). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: int64

      - name: extra_fixtures
        description: "Plumbing fixtures beyond the standard ones. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: int64

      - name: whirlpools
        description: "Built-in whirlpool tubs. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: int64

      - name: hottubs
        description: "Built-in hot tubs. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: int64

      - name: saunas
        description: "Built-in saunas. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: int64

      - name: fireplaces
        description: "Wood or gas fireplaces. Stoves and electric fireplaces aren't counted. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: int64

      # Land
      - name: land_sf
        description: "Land area in square feet. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=slandtotal"
        data_type: numeric(38, 9)

      - name: land_acres
        description: "Land area in acres, to 3 decimal places. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=slandtotal"
        data_type: numeric(38, 9)

      # Areas (sq ft)
      - name: main_living_area_sf
        description: "Finished living area on the main floor, in square feet, measured from the building sketch. | Renamed from main_living_area. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: upper_living_area_sf
        description: "Finished living area above the main floor, in square feet. | Renamed from upper_living_area. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: fin_attic_area_sf
        description: "Finished attic area, in square feet. | Renamed from fin_attic_area. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: total_living_area_sf
        description: "Main floor, upper floors and finished attic together, in square feet, measured on exterior dimensions to ANSI standards. It should equal the sum of those three areas. | Renamed from total_living_area. NULL when it doesn't equal main_living_area + upper_living_area + fin_attic_area (set in int_sales). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: unfin_attic_area_sf
        description: "Unfinished attic reached by stairs and used for storage, in square feet. | Renamed from unfin_attic_area. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: att_garage_area_sf
        description: "Attached garage area, in square feet. | Renamed from att_garage_area. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: open_porch_area_sf
        description: "Open or screened porch area, in square feet. | Renamed from open_porch_area. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: enclose_porch_area_sf
        description: "Three-season porch or breezeway area, in square feet. | Renamed from enclose_porch_area. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: patio_area_sf
        description: "Patio area, in square feet. | Renamed from patio_area. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: deck_area_sf
        description: "Wood deck area, in square feet. | Renamed from deck_area. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: canopy_area_sf
        description: "Metal canopy area, in square feet. | Renamed from canopy_area. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: veneer_area_sf
        description: "Area of brick on the front wall or part of a wall, in square feet. | Renamed from veneer_area. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: carport_area_sf
        description: "Carport area, in square feet. | Renamed from carport_area. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: condo_fin_liv_area_sf
        description: "Finished living area of the condo unit, in square feet. Only filled for condominium units. | Renamed from condo_fin_liv_area. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=condo_unit"
        data_type: numeric(38, 9)

      # Basement
      - name: basement_area_sf
        description: "Total basement area, finished or not, in square feet. | Renamed from basement_area. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: fin_bsmt_area_total_sf
        description: "Total finished basement area, in square feet. It should equal the first and second finished areas added together. | Renamed from fin_bsmt_area_tot. NULL when it doesn't equal fin_bsmt_area1 + fin_bsmt_area2 (set in int_sales). | (inferred from data)"
        data_type: numeric(38, 9)

      - name: fin_bsmt_area1_sf
        description: "First finished basement area, in square feet. | Renamed from fin_bsmt_area1. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: fin_bsmt_area2_sf
        description: "Second finished basement area, in square feet. | Renamed from fin_bsmt_area2. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: bsmt_walkout_ft
        description: "Length of walkout (fully exposed) basement wall, in linear feet. | Renamed from bsmt_walkout. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: bsmt_garage_stalls
        description: "Number of garage stalls in the basement. | Renamed from bsmt_gar_capacity. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: int64
