models:
  - name: fct_sales_groups
    description: >-
      One row per recorded sale document, from int_sales: what the sale covers as a whole. The
      price, assessed values and land cover every parcel the sale lists. Join dp_group_id to
      bridge_dp_groups and gp_group_id to bridge_gp_groups for those parcels, and the dates to
      dim_dates. Join sale_id to bridge_sales for book and pg, to dim_sales_groups for the
      document type, sale conditions, parties and detached structures, and to fct_sales_single
      for the residence on dp. Columns are renamed with their units (_dollars, _sf).
    config:
      contract:
        enforced: true

    data_tests:
      # The same total check as staging; int_sales sets totals that don't add up to NULL.
      - dbt_utils.expression_is_true:
          name: fct_sales_groups__total_full_is_land_plus_bldg
          arguments:
            expression: "total_full_assessment_dollars = land_full_assessment_dollars + bldg_full_assessment_dollars"

    columns:
      # Keys
      - name: sale_id
        description: "One number for the recorded document: the book, then the page in the last 9 digits, e.g. book 12345 page 678 is 12345000000678. | (added in dbt; see the sale_id macro)"
        data_type: int64
        constraints:
          - type: not_null
          - type: primary_key
            warn_unenforced: false
          - type: foreign_key
            to: ref('bridge_sales')
            to_columns: [sale_id]
            warn_unenforced: false
        data_tests:
          - unique
          - relationships:
              arguments:
                to: ref('bridge_sales')
                field: sale_id

      - name: dp_group_id
        description: "The district parcels the sale lists in dps, as a group: join to bridge_dp_groups.group_id for one row per parcel. A hash of the sorted parcels (see the group_id macro), so sales that list the same parcels share a group. | (added in dbt)"
        data_type: string
        constraints:
          - type: not_null
        data_tests:
          # Not a foreign key: group_id repeats in the bridge, once per parcel
          - relationships:
              arguments:
                to: ref('bridge_dp_groups')
                field: group_id

      - name: gp_group_id
        description: "The geoparcels the sale lists in gps, as a group: join to bridge_gp_groups.group_id for one row per geoparcel. A hash of the sorted geoparcels (see the group_id macro), so sales that list the same geoparcels share a group. NULL when gps is blank, as in about 1,700 sales from the 1990s. | (added in dbt)"
        data_type: string
        data_tests:
          # Not a foreign key: group_id repeats in the bridge, once per geoparcel
          - relationships:
              arguments:
                to: ref('bridge_gp_groups')
                field: group_id

      - name: dp_count
        description: "Number of district parcels the sale lists in dps: 1 for a single-parcel sale. | (added in dbt)"
        data_type: int64
        constraints:
          - type: not_null

      # Sale
      - name: sale_date
        description: "Date the parties signed the deed or contract, as entered from the Declaration of Value. This is the signing date, not the recording date. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        data_type: date
        constraints:
          - type: not_null
          - type: foreign_key
            to: ref('dim_dates')
            to_columns: [date_day]
            warn_unenforced: false
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_day

      - name: initial_entry_date
        description: "Probably the date the sale was first entered into the assessor's system. It's usually a few days after sale_date. | (inferred from data)"
        data_type: date
        constraints:
          - type: foreign_key
            to: ref('dim_dates')
            to_columns: [date_day]
            warn_unenforced: false
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_day

      - name: price_dollars
        description: "Price paid for the real property only (the total paid minus any personal property), in whole dollars. Token prices such as 0, 1 or 10 are common on non-market transfers. Covers every parcel in the dp group: it's the price of the whole recorded document. | Renamed from price. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        data_type: int64
        constraints:
          - type: not_null

      # Assessed values
      - name: land_full_assessment_dollars
        description: "Full assessed value of the land at the time of sale, in whole dollars. The value is as of January 1 of that assessment year, including Board of Review changes. Summed over every parcel in the dp group (inferred from data). | Renamed from land_full. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        data_type: int64

      - name: bldg_full_assessment_dollars
        description: "Full assessed value of the buildings at the time of sale, in whole dollars, as of January 1 of that assessment year. Summed over every parcel in the dp group (inferred from data). | Renamed from bldg_full. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        data_type: int64

      - name: total_full_assessment_dollars
        description: "Full assessed value of the land and buildings together at the time of sale, in whole dollars. It should equal land plus buildings. Summed over every parcel in the dp group (inferred from data). | Renamed from total_full. NULL when it doesn't equal land_full + bldg_full (set in int_sales). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        data_type: int64

      # Land
      - name: land_sf
        description: "Land area in square feet. Summed over every parcel in the dp group (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=slandtotal"
        data_type: numeric(38, 9)

      - name: land_acres
        description: "Land area in acres, to 3 decimal places. Summed over every parcel in the dp group (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=slandtotal"
        data_type: numeric(38, 9)

  - name: fct_sales_single
    description: >-
      One row per recorded sale document, from int_sales: the measurements of the residence on
      dp, the one parcel the sale is filed under, as it was sold. Join building_id to
      dim_buildings and dp to dim_district_parcels. Join sale_id to bridge_sales for book and pg,
      and to fct_sales_groups for what the sale covers as a whole, such as the price. Columns are
      renamed with their units (_sf, _ft).
    config:
      contract:
        enforced: true

    data_tests:
      # Both facts hold exactly the same sales
      - dbt_utils.equality:
          name: fct_sales_single__same_sales_as_fct_sales_groups
          arguments:
            compare_model: ref('fct_sales_groups')
            compare_columns:
              - sale_id

      # The same total checks as staging; int_sales sets totals that don't add up to NULL.
      - dbt_utils.expression_is_true:
          name: fct_sales_single__total_living_area_is_sum_of_floors
          arguments:
            expression: "total_living_area_sf = main_living_area_sf + upper_living_area_sf + fin_attic_area_sf"

      - dbt_utils.expression_is_true:
          name: fct_sales_single__fin_bsmt_area_total_is_sum_of_areas
          arguments:
            expression: "fin_bsmt_area_total_sf = fin_bsmt_area1_sf + fin_bsmt_area2_sf"

    columns:
      # Keys
      - name: sale_id
        description: "One number for the recorded document: the book, then the page in the last 9 digits, e.g. book 12345 page 678 is 12345000000678. | (added in dbt; see the sale_id macro)"
        data_type: int64
        constraints:
          - type: not_null
          - type: primary_key
            warn_unenforced: false
          - type: foreign_key
            to: ref('bridge_sales')
            to_columns: [sale_id]
            warn_unenforced: false
        data_tests:
          - unique
          - relationships:
              arguments:
                to: ref('bridge_sales')
                field: sale_id

      - name: dp
        description: "District/parcel number: the 14-digit property ID, e.g. 01000001000000. The first 3 digits are the district. Kept as text because leading zeros matter. In a multi-parcel sale, the one parcel the sale is filed under; its dp group in fct_sales_groups lists them all (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        data_type: string
        constraints:
          - type: not_null
          - type: foreign_key
            to: ref('dim_district_parcels')
            to_columns: [dp]
            warn_unenforced: false
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_district_parcels')
                field: dp
          - dbt_expectations.expect_column_value_lengths_to_equal:
              arguments:
                value: 14

      - name: building_id
        description: "The building version at this sale: a hash of dp and every building column (see the building_columns macro), so it changes whenever any of them changes. NULL when the sale has no building data. | (added in dbt)"
        data_type: string
        constraints:
          - type: foreign_key
            to: ref('dim_buildings')
            to_columns: [building_id]
            warn_unenforced: false
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_buildings')
                field: building_id

      # Rooms and fixtures
      - name: rooms
        description: "Total number of rooms. The assessor records it but doesn't use it in valuation. Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: int64

      - name: bathrooms
        description: "Full bathrooms. A three-quarter bath counts as full. Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: int64

      - name: bedrooms
        description: "Bedrooms above the basement, each at least 80 sq ft with a closet. Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: int64

      - name: toilet_rooms
        description: "Half baths (a toilet and sink). Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: int64

      - name: extra_fixtures
        description: "Plumbing fixtures beyond the standard ones. Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: int64

      - name: whirlpools
        description: "Built-in whirlpool tubs. Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: int64

      - name: hottubs
        description: "Built-in hot tubs. Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: int64

      - name: saunas
        description: "Built-in saunas. Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: int64

      - name: fireplaces
        description: "Wood or gas fireplaces. Stoves and electric fireplaces aren't counted. Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: int64

      # Areas (sq ft)
      - name: main_living_area_sf
        description: "Finished living area on the main floor, in square feet, measured from the building sketch. Describes only the residence on dp (inferred from data). | Renamed from main_living_area. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: upper_living_area_sf
        description: "Finished living area above the main floor, in square feet. Describes only the residence on dp (inferred from data). | Renamed from upper_living_area. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: fin_attic_area_sf
        description: "Finished attic area, in square feet. Describes only the residence on dp (inferred from data). | Renamed from fin_attic_area. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: total_living_area_sf
        description: "Main floor, upper floors and finished attic together, in square feet, measured on exterior dimensions to ANSI standards. It should equal the sum of those three areas. Describes only the residence on dp (inferred from data). | Renamed from total_living_area. NULL when it doesn't equal main_living_area + upper_living_area + fin_attic_area (set in int_sales). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: unfin_attic_area_sf
        description: "Unfinished attic reached by stairs and used for storage, in square feet. Describes only the residence on dp (inferred from data). | Renamed from unfin_attic_area. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: att_garage_area_sf
        description: "Attached garage area, in square feet. Describes only the residence on dp (inferred from data). | Renamed from att_garage_area. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: open_porch_area_sf
        description: "Open or screened porch area, in square feet. Describes only the residence on dp (inferred from data). | Renamed from open_porch_area. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: enclose_porch_area_sf
        description: "Three-season porch or breezeway area, in square feet. Describes only the residence on dp (inferred from data). | Renamed from enclose_porch_area. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: patio_area_sf
        description: "Patio area, in square feet. Describes only the residence on dp (inferred from data). | Renamed from patio_area. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: deck_area_sf
        description: "Wood deck area, in square feet. Describes only the residence on dp (inferred from data). | Renamed from deck_area. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: canopy_area_sf
        description: "Metal canopy area, in square feet. Describes only the residence on dp (inferred from data). | Renamed from canopy_area. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: veneer_area_sf
        description: "Area of brick on the front wall or part of a wall, in square feet. Describes only the residence on dp (inferred from data). | Renamed from veneer_area. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: carport_area_sf
        description: "Carport area, in square feet. Describes only the residence on dp (inferred from data). | Renamed from carport_area. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: condo_fin_liv_area_sf
        description: "Finished living area of the condo unit, in square feet. Only filled for condominium units. Describes only the residence on dp (inferred from data). | Renamed from condo_fin_liv_area. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=condo_unit"
        data_type: numeric(38, 9)

      # Basement
      - name: basement_area_sf
        description: "Total basement area, finished or not, in square feet. Describes only the residence on dp (inferred from data). | Renamed from basement_area. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: fin_bsmt_area_total_sf
        description: "Total finished basement area, in square feet. It should equal the first and second finished areas added together. Describes only the residence on dp (inferred from data). | Renamed from fin_bsmt_area_tot. NULL when it doesn't equal fin_bsmt_area1 + fin_bsmt_area2 (set in int_sales). | (inferred from data)"
        data_type: numeric(38, 9)

      - name: fin_bsmt_area1_sf
        description: "First finished basement area, in square feet. Describes only the residence on dp (inferred from data). | Renamed from fin_bsmt_area1. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: fin_bsmt_area2_sf
        description: "Second finished basement area, in square feet. Describes only the residence on dp (inferred from data). | Renamed from fin_bsmt_area2. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: bsmt_walkout_ft
        description: "Length of walkout (fully exposed) basement wall, in linear feet. Describes only the residence on dp (inferred from data). | Renamed from bsmt_walkout. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: bsmt_garage_stalls
        description: "Number of garage stalls in the basement. Describes only the residence on dp (inferred from data). | Renamed from bsmt_gar_capacity. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: int64
