models:
  - name: dim_grades
    description: >-
      Construction quality grades, from the valid_grades seed: 0 (Executive) to 6 (Sub-
      standard), plus 7 for Other. int_sales takes the first digit of grade as grade_id.
    config:
      contract:
        enforced: true

    columns:
      - name: id
        description: "Base grade number, 0 (Executive) to 6 (Sub-standard); 7 is Other. int_sales stores it in grade_id. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: int64
        constraints:
          - type: not_null
          - type: primary_key
            warn_unenforced: false
        data_tests:
          - unique

      - name: grade
        description: "Construction quality grade and its adjustment: 4-05 is grade 4 (Average) with a -05 adjustment. Grades run from 0 (Executive) to 6 (Sub-standard) and scale the replacement costs in the Iowa Real Property Appraisal Manual. | The grade's name, e.g. Average; the raw grade holds only its number. Other is the catch-all for a digit with no row of its own. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: string
        constraints:
          - type: not_null

      - name: description
        description: "The adjustments this grade can take. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: string

  - name: dim_conditions
    description: >-
      Physical condition ratings, from the valid_conditions seed. int_sales looks up condition
      here, and names not in the list get the Other id.
    config:
      contract:
        enforced: true

    columns:
      - name: id
        description: "Id of the value. int_sales stores it in condition_id. | (added in dbt)"
        data_type: int64
        constraints:
          - type: not_null
          - type: primary_key
            warn_unenforced: false
        data_tests:
          - unique

      - name: condition
        description: "Physical condition, from Excellent (fully revitalized) through Normal (minor deferred maintenance) to Very Poor (uninhabitable). | One row per value. Other is the catch-all for values not in the list. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: string
        constraints:
          - type: not_null

      - name: description
        description: "What the value means, from the assessor's definitions. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: string

  - name: dim_instruments
    description: >-
      Document types (Deed or Contract), from the valid_instruments seed. int_sales looks up
      instrument here, and names not in the list get the Other id.
    config:
      contract:
        enforced: true

    columns:
      - name: id
        description: "Id of the value. int_sales stores it in instrument_id. | (added in dbt)"
        data_type: int64
        constraints:
          - type: not_null
          - type: primary_key
            warn_unenforced: false
        data_tests:
          - unique

      - name: instrument
        description: "Document type: Deed or Contract. Neither the assessor nor the Iowa Department of Revenue uses contract sales for analysis. | One row per value. Other is the catch-all for values not in the list. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        data_type: string
        constraints:
          - type: not_null

      - name: description
        description: "What the value means, from the assessor's definitions. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        data_type: string

  - name: dim_analysis_qualities
    description: >-
      Whether the assessor uses a sale in its market analysis (Good or Bad), from the
      valid_analysis_qualities seed. int_sales looks up analysis_quality here, and names not in
      the list get the Other id.
    config:
      contract:
        enforced: true

    columns:
      - name: id
        description: "Id of the value. int_sales stores it in analysis_quality_id. | (added in dbt)"
        data_type: int64
        constraints:
          - type: not_null
          - type: primary_key
            warn_unenforced: false
        data_tests:
          - unique

      - name: analysis_quality
        description: "Whether the assessor uses the sale in its own market analysis, such as comparable sales: Good means used and Bad means not used. | One row per value. Other is the catch-all for values not in the list. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        data_type: string
        constraints:
          - type: not_null

      - name: description
        description: "What the value means, from the assessor's definitions. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        data_type: string

  - name: dim_school_districts
    description: >-
      School districts, from the valid_school_districts seed. int_parcels looks up
      school_district here, and names not in the list get the Other id.
    config:
      contract:
        enforced: true

    columns:
      - name: id
        description: "Id of the value. int_parcels stores it in school_district_id. | (added in dbt)"
        data_type: int64
        constraints:
          - type: not_null
          - type: primary_key
            warn_unenforced: false
        data_tests:
          - unique

      - name: school_district
        description: "School district the parcel is in, e.g. Ankeny. | One row per value. Other is the catch-all for values not in the list. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=parcel"
        data_type: string
        constraints:
          - type: not_null

  - name: dim_occupancies
    description: >-
      Kinds of dwelling, from the valid_occupancies seed. int_sales looks up occupancy here, and
      names not in the list get the Other id.
    config:
      contract:
        enforced: true

    columns:
      - name: id
        description: "Id of the value. int_sales stores it in occupancy_id. | (added in dbt)"
        data_type: int64
        constraints:
          - type: not_null
          - type: primary_key
            warn_unenforced: false
        data_tests:
          - unique

      - name: occupancy
        description: "Kind of dwelling, e.g. Single Family, Townhouse or Condominium. | One row per value. Other is the catch-all for values not in the list. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: string
        constraints:
