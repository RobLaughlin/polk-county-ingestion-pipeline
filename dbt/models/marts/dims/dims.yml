        enforced: true

    columns:
      - name: id
        description: "Id of the value. int_sales stores it in residence_type_id. | (added in dbt)"
        data_type: int64
        constraints:
          - type: not_null
          - type: primary_key
            warn_unenforced: false
        data_tests:
          - unique

      - name: residence_type
        description: "Number of stories and type of attic, e.g. 1 Story, 1.5 Stories or Split Foyer. | One row per value. Other is the catch-all for values not in the list. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: string
        constraints:
