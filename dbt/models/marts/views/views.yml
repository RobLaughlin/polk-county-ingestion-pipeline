models:
  - name: buildings_descriptive
    description: >-
      One row per building version, from dim_buildings, with each code (occupancy, roof type,
      grade and so on) shown as its name from the matching dim_* lookup instead of its id.

    columns:
      # Keys
      - name: building_id
        description: "The building version at this sale: a hash of dp and every building column (see the building_columns macro), so it changes whenever any of them changes. NULL when the sale has no building data. | (added in dbt)"
        data_tests:
          - unique

      - name: dp
        description: "District/parcel number: the 14-digit property ID, e.g. 01000001000000. The first 3 digits are the district. Kept as text because leading zeros matter. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"

      # Codes
      - name: occupancy
        description: "Kind of dwelling, e.g. Single Family, Townhouse or Condominium. | The name from dim_occupancies, joined on occupancy_id. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"

      - name: residence_type
        description: "Number of stories and type of attic, e.g. 1 Story, 1.5 Stories or Split Foyer. | The name from dim_residence_types, joined on residence_type_id. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"

      - name: bldg_style
        description: "Architectural style, e.g. Conventional, Ranch or Cape Cod. | The name from dim_bldg_styles, joined on bldg_style_id. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"

      - name: exterior_wall_type
        description: "Main exterior wall material, e.g. Vinyl Siding, Brick or Wood Siding. | The name from dim_exterior_wall_types, joined on exterior_wall_type_id. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"

      - name: roof_type
        description: "Roof shape: Gable, Hip, Flat, Gambrel, Mansard, Shed or Other. | The name from dim_roof_types, joined on roof_type_id. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"

      - name: roof_material
        description: "Roof covering, e.g. Asphalt Shingle, Metal or Wood Shingle. | The name from dim_roof_materials, joined on roof_material_id. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"

      - name: foundation
        description: "Foundation material, e.g. Poured Concrete, Concrete Block or Brick. | The name from dim_foundations, joined on foundation_id. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"

      - name: heating
        description: "Heating system, e.g. Gas Forced Air, Heat Pump or Geo-Thermal. | The name from dim_heating_types, joined on heating_id. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"

      - name: fin_bsmt_qual1
        description: "Finish quality of the first finished basement area: Living Quarters, Average Plus, Average or Low. NULL when there's no finished basement. | The name from dim_basement_qualities, joined on fin_bsmt_qual1_id. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"

      - name: fin_bsmt_qual2
        description: "Finish quality of the second finished basement area, with the same values as the first. | The name from dim_basement_qualities, joined on fin_bsmt_qual2_id. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"

      # Grade and condition
      - name: grade
        description: "Construction quality grade and its adjustment: 4-05 is grade 4 (Average) with a -05 adjustment. Grades run from 0 (Executive) to 6 (Sub-standard) and scale the replacement costs in the Iowa Real Property Appraisal Manual. | The base grade's name from dim_grades, e.g. Average, joined on grade_id. NULL when grade doesn't parse. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"

      - name: grade_adjustment
        description: "Construction quality grade and its adjustment: 4-05 is grade 4 (Average) with a -05 adjustment. Grades run from 0 (Executive) to 6 (Sub-standard) and scale the replacement costs in the Iowa Real Property Appraisal Manual. | The adjustment part of grade as a number, e.g. -5 for 4-05, and 0 when there is none (set in int_sales). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"

      - name: condition
        description: "Physical condition, from Excellent (fully revitalized) through Normal (minor deferred maintenance) to Very Poor (uninhabitable). | The name from dim_conditions, joined on condition_id. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"

      # Units and percentages
      - name: families
        description: "Number of living units in the dwelling. 1 by default; 2 or 3 means extra units, and more than 3 is assessed as commercial. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"

      - name: brick_pct
        description: "Percent of the house exterior that is full-height brick, 0 to 100. Brick on only the front wall is counted in the veneer area instead. | Renamed from percent_brick. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"

      - name: air_conditioning_pct
        description: "Percent of the living area cooled by central air, 0 to 100. | Renamed from air_conditioning. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"

      - name: completed_pct
        description: "How far along an unfinished dwelling is, as a percent. Construction stages include Framing (30) and Painting (90). NULL for finished homes. | Renamed from percent_complete. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"

      - name: garage_brick_pct
        description: "Percent of the attached garage exterior that is brick, 0 to 100. A percent, not an area. | Renamed from garage_brick. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"

      # Years
      - name: year_built
        description: "Year the house was originally built. | NULL when it isn't a 4-digit year (set in int_sales). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"

      - name: eff_year_built
        description: "Effective year built: the house's age adjusted for updates, from the appraiser's calculator. | NULL when it isn't a 4-digit year (set in int_sales). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"

      - name: year_remodel
        description: "Year of a major remodel. NULL when there hasn't been one. | NULL when it isn't a 4-digit year (set in int_sales). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"

      - name: condo_year_built
        description: "Year the condo unit was built. Only filled for condominium units. | NULL when it isn't a 4-digit year (set in int_sales). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=condo_unit"

      # When this version was seen
      - name: first_sale_date
        description: "Date of the first sale that saw this building version. | (added in dbt)"

      - name: last_sale_date
        description: "Date of the last sale that saw this building version. | (added in dbt)"


  - name: sales_groups_descriptive
    description: >-
      One row per recorded sale document, from fct_sales_groups: what the sale covers as a whole,
      with instrument, quality1, quality2 and analysis_quality shown as names from their dim_*
      lookups instead of ids. The residence on dp is in sales_single_descriptive, on the same
      sale_id.

    columns:
      # Keys
      - name: sale_id
        description: "One number for the recorded document: the book, then the page in the last 9 digits, e.g. book 12345 page 678 is 12345000000678. | (added in dbt; see the sale_id macro)"
        data_tests:
          - unique

      - name: book
        description: "Recorder's book number for the recorded document. Book numbers rise over time. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"

      - name: pg
        description: "Recorder's page number within the book. Together, book and pg identify one recorded document. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"

      - name: dp_group_id
        description: "The district parcels the sale lists in dps, as a group: join to bridge_dp_groups.group_id for one row per parcel. A hash of the sorted parcels (see the group_id macro), so sales that list the same parcels share a group. | (added in dbt)"

      - name: gp_group_id
        description: "The geoparcels the sale lists in gps, as a group: join to bridge_gp_groups.group_id for one row per geoparcel. A hash of the sorted geoparcels (see the group_id macro), so sales that list the same geoparcels share a group. NULL when gps is blank, as in about 1,700 sales from the 1990s. | (added in dbt)"

      - name: dp_count
        description: "Number of district parcels the sale lists in dps: 1 for a single-parcel sale. | (added in dbt)"

      # Sale
      - name: sale_date
        description: "Date the parties signed the deed or contract, as entered from the Declaration of Value. This is the signing date, not the recording date. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"

      - name: initial_entry_date
        description: "Probably the date the sale was first entered into the assessor's system. It's usually a few days after sale_date. | (inferred from data)"

      - name: price_dollars
        description: "Price paid for the real property only (the total paid minus any personal property), in whole dollars. Token prices such as 0, 1 or 10 are common on non-market transfers. Covers every parcel in the dp group: it's the price of the whole recorded document. | Renamed from price. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"

      - name: seller
        description: "Seller (grantor). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"

      - name: buyer
        description: "Buyer (grantee). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"

      - name: instrument
        description: "Document type: Deed or Contract. Neither the assessor nor the Iowa Department of Revenue uses contract sales for analysis. | The name from dim_instruments, joined on instrument_id. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"

      - name: quality1
        description: "First Iowa Department of Revenue sale condition: the reason, if any, the sale isn't a normal market sale, e.g. Family or Foreclosure. Arms Length means no condition. | The name from dim_quality1_conditions, joined on quality1_id. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"

      - name: quality2
        description: "Second sale condition, for sales with two conditions. No Code means no second condition. | The name from dim_quality2_conditions, joined on quality2_id. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"

      - name: analysis_quality
        description: "Whether the assessor uses the sale in its own market analysis, such as comparable sales: Good means used and Bad means not used. | The name from dim_analysis_qualities, joined on analysis_quality_id. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"

      # Assessed values
      - name: land_full_assessment_dollars
        description: "Full assessed value of the land at the time of sale, in whole dollars. The value is as of January 1 of that assessment year, including Board of Review changes. Summed over every parcel in the dp group (inferred from data). | Renamed from land_full. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"

      - name: bldg_full_assessment_dollars
        description: "Full assessed value of the buildings at the time of sale, in whole dollars, as of January 1 of that assessment year. Summed over every parcel in the dp group (inferred from data). | Renamed from bldg_full. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"

      - name: total_full_assessment_dollars
        description: "Full assessed value of the land and buildings together at the time of sale, in whole dollars. It should equal land plus buildings. Summed over every parcel in the dp group (inferred from data). | Renamed from total_full. NULL when it doesn't equal land_full + bldg_full (set in int_sales). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"

      # Land
      - name: land_sf
        description: "Land area in square feet. Summed over every parcel in the dp group (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=slandtotal"

      - name: land_acres
        description: "Land area in acres, to 3 decimal places. Summed over every parcel in the dp group (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=slandtotal"

      # Detached structures
      - name: detached_structs
        description: "Detached structures on the parcel as CODE/size pairs, e.g. 'BBK/1584 SHD/120' for a bank barn and a shed; the size is probably square feet. Common codes: GAR Garage, SHD Shed, PTC Concrete Patio, SWR Outdoor Pool, DEC Deck. Includes the structures on every parcel in the dp group (inferred from data). | (the CODE/size format is inferred from data; the source page lists the codes) | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=detached"


  - name: sales_single_descriptive
    description: >-
      One row per recorded sale document, from fct_sales_single: the residence on dp as it was
      sold, plus the descriptive columns of its building version from buildings_descriptive. The
      building columns are NULL when the sale has no building data. What the sale covers as a
      whole is in sales_groups_descriptive, on the same sale_id.

    columns:
      # Keys
      - name: sale_id
        description: "One number for the recorded document: the book, then the page in the last 9 digits, e.g. book 12345 page 678 is 12345000000678. | (added in dbt; see the sale_id macro)"
        data_tests:
          - unique

      - name: book
        description: "Recorder's book number for the recorded document. Book numbers rise over time. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"

      - name: pg
        description: "Recorder's page number within the book. Together, book and pg identify one recorded document. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"

      - name: dp
        description: "District/parcel number: the 14-digit property ID, e.g. 01000001000000. The first 3 digits are the district. Kept as text because leading zeros matter. In a multi-parcel sale, the one parcel the sale is filed under; its dp group in fct_sales_groups lists them all (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"

      - name: building_id
        description: "The building version at this sale: a hash of dp and every building column (see the building_columns macro), so it changes whenever any of them changes. NULL when the sale has no building data. | (added in dbt)"

      # Rooms and fixtures
      - name: rooms
        description: "Total number of rooms. The assessor records it but doesn't use it in valuation. Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"

      - name: bathrooms
        description: "Full bathrooms. A three-quarter bath counts as full. Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"

      - name: bedrooms
        description: "Bedrooms above the basement, each at least 80 sq ft with a closet. Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"

      - name: toilet_rooms
        description: "Half baths (a toilet and sink). Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"

      - name: extra_fixtures
        description: "Plumbing fixtures beyond the standard ones. Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"

      - name: whirlpools
        description: "Built-in whirlpool tubs. Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"

      - name: hottubs
        description: "Built-in hot tubs. Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"

      - name: saunas
        description: "Built-in saunas. Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"

      - name: fireplaces
        description: "Wood or gas fireplaces. Stoves and electric fireplaces aren't counted. Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"

      # Building (from buildings_descriptive)
      - name: occupancy
        description: "Kind of dwelling, e.g. Single Family, Townhouse or Condominium. | The name from dim_occupancies, joined on occupancy_id. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"

      - name: residence_type
        description: "Number of stories and type of attic, e.g. 1 Story, 1.5 Stories or Split Foyer. | The name from dim_residence_types, joined on residence_type_id. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"

      - name: bldg_style
        description: "Architectural style, e.g. Conventional, Ranch or Cape Cod. | The name from dim_bldg_styles, joined on bldg_style_id. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"

      - name: exterior_wall_type
        description: "Main exterior wall material, e.g. Vinyl Siding, Brick or Wood Siding. | The name from dim_exterior_wall_types, joined on exterior_wall_type_id. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"

      - name: roof_type
        description: "Roof shape: Gable, Hip, Flat, Gambrel, Mansard, Shed or Other. | The name from dim_roof_types, joined on roof_type_id. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"

      - name: roof_material
        description: "Roof covering, e.g. Asphalt Shingle, Metal or Wood Shingle. | The name from dim_roof_materials, joined on roof_material_id. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"

      - name: foundation
        description: "Foundation material, e.g. Poured Concrete, Concrete Block or Brick. | The name from dim_foundations, joined on foundation_id. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"

      - name: heating
        description: "Heating system, e.g. Gas Forced Air, Heat Pump or Geo-Thermal. | The name from dim_heating_types, joined on heating_id. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"

      - name: fin_bsmt_qual1
        description: "Finish quality of the first finished basement area: Living Quarters, Average Plus, Average or Low. NULL when there's no finished basement. | The name from dim_basement_qualities, joined on fin_bsmt_qual1_id. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"

      - name: fin_bsmt_qual2
        description: "Finish quality of the second finished basement area, with the same values as the first. | The name from dim_basement_qualities, joined on fin_bsmt_qual2_id. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"

      - name: grade
        description: "Construction quality grade and its adjustment: 4-05 is grade 4 (Average) with a -05 adjustment. Grades run from 0 (Executive) to 6 (Sub-standard) and scale the replacement costs in the Iowa Real Property Appraisal Manual. | The base grade's name from dim_grades, e.g. Average, joined on grade_id. NULL when grade doesn't parse. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"

      - name: grade_adjustment
        description: "Construction quality grade and its adjustment: 4-05 is grade 4 (Average) with a -05 adjustment. Grades run from 0 (Executive) to 6 (Sub-standard) and scale the replacement costs in the Iowa Real Property Appraisal Manual. | The adjustment part of grade as a number, e.g. -5 for 4-05, and 0 when there is none (set in int_sales). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"

      - name: condition
        description: "Physical condition, from Excellent (fully revitalized) through Normal (minor deferred maintenance) to Very Poor (uninhabitable). | The name from dim_conditions, joined on condition_id. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"

      - name: families
        description: "Number of living units in the dwelling. 1 by default; 2 or 3 means extra units, and more than 3 is assessed as commercial. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"

      - name: brick_pct
        description: "Percent of the house exterior that is full-height brick, 0 to 100. Brick on only the front wall is counted in the veneer area instead. | Renamed from percent_brick. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"

      - name: air_conditioning_pct
        description: "Percent of the living area cooled by central air, 0 to 100. | Renamed from air_conditioning. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"

      - name: completed_pct
