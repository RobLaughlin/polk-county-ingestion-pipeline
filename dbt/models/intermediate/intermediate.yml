models:
  - name: int_parcels
    config:
      contract:
        enforced: true

    columns:
      - name: dp
        data_type: string
        constraints:
          - type: not_null

        data_tests:
          - unique
          - dbt_expectations.expect_column_value_lengths_to_equal:
              arguments:
                value: 14

      - name: gp
        data_type: string

        data_tests:
          - dbt_expectations.expect_column_value_lengths_to_equal:
              arguments:
                value: 12

      - name: jurisdiction
        data_type: string

      - name: zip
        data_type: string

        data_tests:
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: "^[0-9]{5}$"

      - name: nbhd
        data_type: string

      - name: pocket
        data_type: string

      - name: address
        data_type: string

      - name: school_district
        data_type: string

      - name: platname
        data_type: string
