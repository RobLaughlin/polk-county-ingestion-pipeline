models:
  - name: int_sales
    description: >-
      Cleans and codes stg_sale_data, still one row per sale document. Years that aren't 4
      digits become NULL, and so do totals that don't equal the sum of their parts. Each coded
      name, such as occupancy or roof_type, is replaced by its id in the matching dim_* lookup.
      grade is split into grade_id and grade_adjustment, and each sale gets the building_id of
      its building version. dp_group_id and gp_group_id key the parcels in dps and gps into the
      bridge_dp_groups and bridge_gp_groups marts.
    config:
      contract:
        enforced: true

    constraints:
      - type: primary_key
        columns: [book, pg]
        warn_unenforced: false

    data_tests:
      # Ensure (book, pg) is a unique compound key
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - book
              - pg

      # Totals that don't add up are set to NULL in int_sales.sql, so these should always pass.
      - dbt_utils.expression_is_true:
          name: int_sales__total_full_is_land_plus_bldg
          arguments:
            expression: "total_full = land_full + bldg_full"

      - dbt_utils.expression_is_true:
          name: int_sales__total_living_area_is_sum_of_floors
          arguments:
            expression: "total_living_area = main_living_area + upper_living_area + fin_attic_area"

      - dbt_utils.expression_is_true:
          name: int_sales__fin_bsmt_area_tot_is_sum_of_areas
          arguments:
            expression: "fin_bsmt_area_tot = fin_bsmt_area1 + fin_bsmt_area2"

    # Each *_id column references the id of a dim_* lookup in the marts. They can be NULL.
    columns:
      - name: dp
        description: "District/parcel number: the 14-digit property ID, e.g. 01000001000000. The first 3 digits are the district. Kept as text because leading zeros matter. In a multi-parcel sale, the one parcel the sale is filed under; dps lists them all (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        data_type: string
        constraints:
          - type: not_null

      - name: sale_date
        description: "Date the parties signed the deed or contract, as entered from the Declaration of Value. This is the signing date, not the recording date. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        data_type: date
        constraints:
          - type: not_null

      - name: book
        description: "Recorder's book number for the recorded document. Book numbers rise over time. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        data_type: int64
        constraints:
          - type: not_null

      - name: pg
        description: "Recorder's page number within the book. Together, book and pg identify one recorded document. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        data_type: int64
        constraints:
          - type: not_null

      - name: price
        description: "Price paid for the real property only (the total paid minus any personal property), in whole dollars. Token prices such as 0, 1 or 10 are common on non-market transfers. Covers every parcel in dps: it's the price of the whole recorded document. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        data_type: int64
        constraints:
          - type: not_null

      - name: seller
        description: "Seller (grantor). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        data_type: string

      - name: buyer
        description: "Buyer (grantee). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        data_type: string

      - name: land_full
        description: "Full assessed value of the land at the time of sale, in whole dollars. The value is as of January 1 of that assessment year, including Board of Review changes. Summed over every parcel in dps (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        data_type: int64

      - name: bldg_full
        description: "Full assessed value of the buildings at the time of sale, in whole dollars, as of January 1 of that assessment year. Summed over every parcel in dps (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        data_type: int64

      - name: total_full
        description: "Full assessed value of the land and buildings together at the time of sale, in whole dollars. It should equal land plus buildings. Summed over every parcel in dps (inferred from data). | Set to NULL when it doesn't equal land_full + bldg_full. Kept when a part is missing. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        data_type: int64

      - name: dps
        description: "Every parcel in the sale, in short form: the district, then the parcel parts without leading zeros, so 18101588000000 becomes 181/1588. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        data_type: string

      - name: gps
        description: "Every geoparcel in the sale: the same as gp for a one-parcel sale, otherwise a comma-separated list. | (inferred from data)"
        data_type: string

      - name: land_sf
        description: "Land area in square feet. Summed over every parcel in dps (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=slandtotal"
        data_type: numeric(38, 9)

      - name: land_acres
        description: "Land area in acres, to 3 decimal places. Summed over every parcel in dps (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=slandtotal"
        data_type: numeric(38, 9)

      - name: percent_brick
        description: "Percent of the house exterior that is full-height brick, 0 to 100. Brick on only the front wall is counted in the veneer area instead. Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: main_living_area
        description: "Finished living area on the main floor, in square feet, measured from the building sketch. Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: upper_living_area
        description: "Finished living area above the main floor, in square feet. Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: fin_attic_area
        description: "Finished attic area, in square feet. Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: total_living_area
        description: "Main floor, upper floors and finished attic together, in square feet, measured on exterior dimensions to ANSI standards. It should equal the sum of those three areas. Describes only the residence on dp (inferred from data). | Set to NULL when it doesn't equal main_living_area + upper_living_area + fin_attic_area. Kept when a part is missing. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: unfin_attic_area
        description: "Unfinished attic reached by stairs and used for storage, in square feet. Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: basement_area
        description: "Total basement area, finished or not, in square feet. Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: fin_bsmt_area_tot
        description: "Total finished basement area, in square feet. It should equal the first and second finished areas added together. Describes only the residence on dp (inferred from data). | Set to NULL when it doesn't equal fin_bsmt_area1 + fin_bsmt_area2. Kept when a part is missing. | (inferred from data)"
        data_type: numeric(38, 9)

      - name: bsmt_walkout
        description: "Length of walkout (fully exposed) basement wall, in linear feet. Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: bsmt_gar_capacity
        description: "Number of garage stalls in the basement. Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: int64

      - name: att_garage_area
        description: "Attached garage area, in square feet. Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: garage_brick
        description: "Percent of the attached garage exterior that is brick, 0 to 100. A percent, not an area. Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: open_porch_area
        description: "Open or screened porch area, in square feet. Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: enclose_porch_area
        description: "Three-season porch or breezeway area, in square feet. Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: patio_area
        description: "Patio area, in square feet. Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: deck_area
        description: "Wood deck area, in square feet. Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: canopy_area
        description: "Metal canopy area, in square feet. Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: veneer_area
        description: "Area of brick on the front wall or part of a wall, in square feet. Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: carport_area
        description: "Carport area, in square feet. Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: fin_bsmt_area1
        description: "First finished basement area, in square feet. Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: fin_bsmt_area2
        description: "Second finished basement area, in square feet. Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: bathrooms
        description: "Full bathrooms. A three-quarter bath counts as full. Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: int64

      - name: toilet_rooms
        description: "Half baths (a toilet and sink). Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: int64

      - name: extra_fixtures
        description: "Plumbing fixtures beyond the standard ones. Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: int64

      - name: whirlpools
        description: "Built-in whirlpool tubs. Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: int64

      - name: hottubs
        description: "Built-in hot tubs. Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: int64

      - name: saunas
        description: "Built-in saunas. Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: int64

      - name: fireplaces
        description: "Wood or gas fireplaces. Stoves and electric fireplaces aren't counted. Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: int64

      - name: bedrooms
        description: "Bedrooms above the basement, each at least 80 sq ft with a closet. Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: int64

      - name: rooms
        description: "Total number of rooms. The assessor records it but doesn't use it in valuation. Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: int64

      - name: families
        description: "Number of living units in the dwelling. 1 by default; 2 or 3 means extra units, and more than 3 is assessed as commercial. Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: year_built
        description: "Year the house was originally built. Describes only the residence on dp (inferred from data). | Set to NULL when it isn't a 4-digit year, such as the 0 placeholders. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              name: int_sales__year_built_is_4_digits
              arguments:
                min_value: 1000
                max_value: 9999

      - name: year_remodel
        description: "Year of a major remodel. NULL when there hasn't been one. Describes only the residence on dp (inferred from data). | Set to NULL when it isn't a 4-digit year, such as the 0 placeholders. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              name: int_sales__year_remodel_is_4_digits
              arguments:
                min_value: 1000
                max_value: 9999

      - name: eff_year_built
        description: "Effective year built: the house's age adjusted for updates, from the appraiser's calculator. Describes only the residence on dp (inferred from data). | Set to NULL when it isn't a 4-digit year, such as the 0 placeholders. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              name: int_sales__eff_year_built_is_4_digits
              arguments:
                min_value: 1000
                max_value: 9999

      - name: air_conditioning
        description: "Percent of the living area cooled by central air, 0 to 100. Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: percent_complete
        description: "How far along an unfinished dwelling is, as a percent. Construction stages include Framing (30) and Painting (90). NULL for finished homes. Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: numeric(38, 9)

      - name: condo_fin_liv_area
        description: "Finished living area of the condo unit, in square feet. Only filled for condominium units. Describes only the residence on dp (inferred from data). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=condo_unit"
        data_type: numeric(38, 9)

      - name: condo_year_built
        description: "Year the condo unit was built. Only filled for condominium units. Describes only the residence on dp (inferred from data). | Set to NULL when it isn't a 4-digit year, such as the 0 placeholders. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=condo_unit"
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              name: int_sales__condo_year_built_is_4_digits
              arguments:
                min_value: 1000
                max_value: 9999

      - name: detached_structs
        description: "Detached structures on the parcel as CODE/size pairs, e.g. 'BBK/1584 SHD/120' for a bank barn and a shed; the size is probably square feet. Common codes: GAR Garage, SHD Shed, PTC Concrete Patio, SWR Outdoor Pool, DEC Deck. Includes the structures on every parcel in dps (inferred from data). | (the CODE/size format is inferred from data; the source page lists the codes) | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=detached"
        data_type: string

      - name: initial_entry_date
        description: "Probably the date the sale was first entered into the assessor's system. It's usually a few days after sale_date. | (inferred from data)"
        data_type: date

      - name: yr
        description: "Year of the sale. It always equals the year of sale_date. | Set to NULL when it isn't a 4-digit year, such as the 0 placeholders. | (inferred from data)"
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              name: int_sales__yr_is_4_digits
              arguments:
                min_value: 1000
                max_value: 9999

      - name: instrument_id
        description: "Document type: Deed or Contract. Neither the assessor nor the Iowa Department of Revenue uses contract sales for analysis. | Replaces instrument with its id in dim_instruments. Names not in the list get the Other id. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        data_type: int64
        constraints:
          - type: foreign_key
            to: ref('dim_instruments')
            to_columns: [id]
            warn_unenforced: false
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_instruments')
                field: id

      - name: quality1_id
        description: "First Iowa Department of Revenue sale condition: the reason, if any, the sale isn't a normal market sale, e.g. Family or Foreclosure. Arms Length means no condition. | Replaces quality1 with its id in dim_quality1_conditions. Names not in the list get the Other id. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        data_type: int64
        constraints:
          - type: foreign_key
            to: ref('dim_quality1_conditions')
            to_columns: [id]
            warn_unenforced: false
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_quality1_conditions')
                field: id

      - name: quality2_id
        description: "Second sale condition, for sales with two conditions. No Code means no second condition. | Replaces quality2 with its id in dim_quality2_conditions. Names not in the list get the Other id. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        data_type: int64
        constraints:
          - type: foreign_key
            to: ref('dim_quality2_conditions')
            to_columns: [id]
            warn_unenforced: false
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_quality2_conditions')
                field: id

      - name: analysis_quality_id
        description: "Whether the assessor uses the sale in its own market analysis, such as comparable sales: Good means used and Bad means not used. | Replaces analysis_quality with its id in dim_analysis_qualities. Names not in the list get the Other id. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        data_type: int64
        constraints:
          - type: foreign_key
            to: ref('dim_analysis_qualities')
            to_columns: [id]
            warn_unenforced: false
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_analysis_qualities')
                field: id

      - name: occupancy_id
        description: "Kind of dwelling, e.g. Single Family, Townhouse or Condominium. Describes only the residence on dp (inferred from data). | Replaces occupancy with its id in dim_occupancies. Names not in the list get the Other id. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: int64
        constraints:
          - type: foreign_key
            to: ref('dim_occupancies')
            to_columns: [id]
            warn_unenforced: false
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_occupancies')
                field: id

      - name: residence_type_id
        description: "Number of stories and type of attic, e.g. 1 Story, 1.5 Stories or Split Foyer. Describes only the residence on dp (inferred from data). | Replaces residence_type with its id in dim_residence_types. Names not in the list get the Other id. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        data_type: int64
        constraints:
          - type: foreign_key
            to: ref('dim_residence_types')
            to_columns: [id]
            warn_unenforced: false
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_residence_types')
                field: id

      - name: bldg_style_id
