models:
  - name: int_sales
    config:
      contract:
        enforced: true

    constraints:
      - type: primary_key
        columns: [book, pg]

    data_tests:
      # Ensure (book, pg) is a unique compound key
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - book
              - pg

    # Each *_id column references the id of a dim_* lookup in the marts. They can be NULL.
    columns:
      - name: dp
        data_type: string
        constraints:
          - type: not_null

      - name: sale_date
        data_type: date
        constraints:
          - type: not_null

      - name: book
        data_type: int64
        constraints:
          - type: not_null

      - name: pg
        data_type: int64
        constraints:
          - type: not_null

      - name: price
        data_type: int64
        constraints:
          - type: not_null

      - name: seller
        data_type: string

      - name: buyer
        data_type: string

      - name: land_full
        data_type: int64

      - name: bldg_full
        data_type: int64

      - name: total_full
        data_type: int64

      - name: dps
        data_type: string

      - name: gps
        data_type: string

      - name: land_sf
        data_type: numeric(38, 9)

      - name: land_acres
        data_type: numeric(38, 9)

      - name: percent_brick
        data_type: numeric(38, 9)

      - name: main_living_area
        data_type: numeric(38, 9)

      - name: upper_living_area
        data_type: numeric(38, 9)

      - name: fin_attic_area
        data_type: numeric(38, 9)

      - name: total_living_area
        data_type: numeric(38, 9)

      - name: unfin_attic_area
        data_type: numeric(38, 9)

      - name: basement_area
        data_type: numeric(38, 9)

      - name: fin_bsmt_area_tot
        data_type: numeric(38, 9)

      - name: bsmt_walkout
        data_type: numeric(38, 9)

      - name: bsmt_gar_capacity
        data_type: int64

      - name: att_garage_area
        data_type: numeric(38, 9)

      - name: garage_brick
        data_type: numeric(38, 9)

      - name: open_porch_area
        data_type: numeric(38, 9)

      - name: enclose_porch_area
        data_type: numeric(38, 9)

      - name: patio_area
        data_type: numeric(38, 9)

      - name: deck_area
        data_type: numeric(38, 9)

      - name: canopy_area
        data_type: numeric(38, 9)

      - name: veneer_area
        data_type: numeric(38, 9)

      - name: carport_area
        data_type: numeric(38, 9)

      - name: fin_bsmt_area1
        data_type: numeric(38, 9)

      - name: fin_bsmt_area2
        data_type: numeric(38, 9)

      - name: bathrooms
        data_type: int64

      - name: toilet_rooms
        data_type: int64

      - name: extra_fixtures
        data_type: int64

      - name: whirlpools
        data_type: int64

      - name: hottubs
        data_type: int64

      - name: saunas
        data_type: int64

      - name: fireplaces
        data_type: int64

      - name: bedrooms
        data_type: int64

      - name: rooms
        data_type: int64

      - name: families
        data_type: numeric(38, 9)

      - name: year_built
        data_type: int64

      - name: year_remodel
        data_type: int64

      - name: eff_year_built
        data_type: int64

      - name: air_conditioning
        data_type: numeric(38, 9)

      - name: percent_complete
        data_type: numeric(38, 9)

      - name: condo_fin_liv_area
        data_type: numeric(38, 9)

      - name: condo_year_built
        data_type: int64

      - name: detached_structs
        data_type: string

      - name: initial_entry_date
        data_type: date

      - name: yr
        data_type: int64

      - name: instrument_id
        data_type: int64
        constraints:
          - type: foreign_key
            to: ref('dim_instruments')
            to_columns: [id]

      - name: quality1_id
        data_type: int64
        constraints:
          - type: foreign_key
            to: ref('dim_quality1_conditions')
            to_columns: [id]

      - name: quality2_id
        data_type: int64
        constraints:
          - type: foreign_key
            to: ref('dim_quality2_conditions')
            to_columns: [id]

      - name: analysis_quality_id
        data_type: int64
        constraints:
          - type: foreign_key
            to: ref('dim_analysis_qualities')
            to_columns: [id]

      - name: occupancy_id
        data_type: int64
        constraints:
          - type: foreign_key
            to: ref('dim_occupancies')
            to_columns: [id]

      - name: residence_type_id
        data_type: int64
        constraints:
          - type: foreign_key
            to: ref('dim_residence_types')
            to_columns: [id]

      - name: bldg_style_id
        data_type: int64
        constraints:
          - type: foreign_key
            to: ref('dim_bldg_styles')
            to_columns: [id]

      - name: exterior_wall_type_id
        data_type: int64
        constraints:
          - type: foreign_key
            to: ref('dim_exterior_wall_types')
            to_columns: [id]

      - name: roof_type_id
        data_type: int64
        constraints:
          - type: foreign_key
            to: ref('dim_roof_types')
            to_columns: [id]

      - name: roof_material_id
        data_type: int64
        constraints:
          - type: foreign_key
            to: ref('dim_roof_materials')
            to_columns: [id]

      - name: foundation_id
        data_type: int64
        constraints:
          - type: foreign_key
            to: ref('dim_foundations')
            to_columns: [id]

      - name: heating_id
        data_type: int64
        constraints:
          - type: foreign_key
            to: ref('dim_heating_types')
            to_columns: [id]

      - name: fin_bsmt_qual1_id
        data_type: int64
        constraints:
          - type: foreign_key
            to: ref('dim_basement_qualities')
            to_columns: [id]

      - name: fin_bsmt_qual2_id
        data_type: int64
        constraints:
          - type: foreign_key
            to: ref('dim_basement_qualities')
            to_columns: [id]

      - name: condition_id
        data_type: int64
        constraints:
          - type: foreign_key
            to: ref('dim_conditions')
            to_columns: [id]

      - name: grade_id
        data_type: int64
        constraints:
          - type: foreign_key
            to: ref('dim_grades')
            to_columns: [id]

      - name: grade_adjustment
        data_type: int64

      # Hash of dp + the building_columns() macro; NULL when the sale has no building data
      - name: building_id
        data_type: string

  - name: int_parcels
    config:
      contract:
        enforced: true

    columns:
      - name: dp
        data_type: string
        constraints:
          - type: not_null
          - type: primary_key

        data_tests:
          - unique

      - name: gp
        data_type: string

      - name: jurisdiction
        data_type: string

      - name: zip
        data_type: string

      - name: nbhd
        data_type: string

      - name: pocket
        data_type: string

      - name: address
        data_type: string

      - name: platname
        data_type: string

      - name: parcel_descriptions
        data_type: string

      - name: school_district_id
        data_type: int64
        constraints:
          - type: foreign_key
            to: ref('dim_school_districts')
            to_columns: [id]
