        description: "The geoparcels the sale lists in gps, as a group: join to bridge_gp_groups.group_id for one row per geoparcel. A hash of the sorted geoparcels (see the group_id macro), so sales that list the same geoparcels share a group. NULL when gps is blank, as in about 1,700 sales from the 1990s. | (added in dbt)"
        data_type: string

  - name: int_district_parcels
    description: >-
      Cleans stg_district_parcels, still one row per district parcel, and adds the parcels only
      ever listed in another sale's dps. Those have no sale of their own, so they have just dp
      and dp_short. dp_short is computed from dp, zip codes that aren't 5 digits become NULL, and
      school_district is replaced by its id in dim_school_districts.
    config:
      contract:
        enforced: true

    data_tests:
      # Invalid zips are set to NULL in int_district_parcels.sql, so this should always pass.
      - dbt_utils.expression_is_true:
          name: int_district_parcels__zip_is_5_digits
          arguments:
            expression: "REGEXP_CONTAINS(zip, r'^[0-9]{5}$')"

      # dp_short has no leading zeros in a part and no trailing 0 parts (see the short_dp macro).
      - dbt_utils.expression_is_true:
          name: int_district_parcels__dp_short_is_short_form
          arguments:
            expression: "REGEXP_CONTAINS(dp_short, r'^[0-9]{3}/(0|[1-9][0-9]{0,4})(-(0|[1-9][0-9]{0,2})-[1-9][0-9]{0,2}|-[1-9][0-9]{0,2})?$')"

      # Converting dp_short back must give exactly dp, so the two always describe the same parcel.
      - dbt_utils.expression_is_true:
          name: int_district_parcels__dp_is_long_form_of_dp_short
          arguments:
            expression: "dp = {{ long_dp('dp_short') }}"

    columns:
      - name: dp
        description: "District/parcel number: the 14-digit property ID, e.g. 01000001000000. The first 3 digits are the district. Kept as text because leading zeros matter. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        data_type: string
        constraints:
          - type: not_null
          - type: primary_key
            warn_unenforced: false

        data_tests:
          - unique

      - name: dp_short
        description: "District/parcel number in the short form dps uses: the district, a slash, then the parcel parts without leading zeros, with trailing 0 parts left off, e.g. 18101588000000 is 181/1588 and 17000370000379 is 170/370-0-379. | Added in int_district_parcels from dp (see the short_dp macro). The trailing-zero rule is inferred from data. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        data_type: string
        constraints:
          - type: not_null

      - name: gp
        description: "Geoparcel number, 12 digits, e.g. 802434255001. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=xysall"
        data_type: string

      - name: jurisdiction
        description: "City or township the parcel is in, e.g. ANKENY or ALLEN TWNSHP. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=districts"
        data_type: string

      - name: zip
        description: "Zip code of the property sold. | Set to NULL when it isn't 5 digits. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        data_type: string

      - name: nbhd
        description: "Assessor neighborhood code, 4 characters, e.g. AK02. nbhd and pocket together identify a neighborhood. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=nbhds"
        data_type: string

      - name: pocket
        description: "Sub-area of the neighborhood, 2 characters, e.g. G3. nbhd and pocket together identify a neighborhood. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=nbhds"
        data_type: string

      - name: address
        description: "Street address of the property sold. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        data_type: string

      - name: platname
        description: "Name of the recorded plat (subdivision) the parcel is in, e.g. WHITE BIRCH PLAT 1. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=plats"
        data_type: string

      - name: school_district_id
        description: "School district the parcel is in, e.g. Ankeny. | Replaces school_district with its id in dim_school_districts. Names not in the list get the Other id. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=parcel"
        data_type: int64
        constraints:
          - type: foreign_key
            to: ref('dim_school_districts')
            to_columns: [id]
            warn_unenforced: false
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_school_districts')
                field: id
