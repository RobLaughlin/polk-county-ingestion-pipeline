models:
  - name: stg_sale_data
    config:
      contract:
        enforced: true

    constraints:
      - type: primary_key
        columns: [book, pg]
        warn_unenforced: false

    data_tests:
      # Ensure (book, pg) is a unique compound key
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - book
              - pg

      # Checks use dbt_utils.expression_is_true so store_failures keeps the whole failing row.
      - dbt_utils.expression_is_true:
          name: stg_sale_data__yr_matches_sale_date
          arguments:
            expression: "yr = EXTRACT(YEAR FROM sale_date)"
          config:
            severity: warn

      - dbt_utils.expression_is_true:
          name: stg_sale_data__total_full_is_land_plus_bldg
          arguments:
            expression: "total_full = land_full + bldg_full"
          config:
            severity: warn

      - dbt_utils.expression_is_true:
          name: stg_sale_data__total_living_area_is_sum_of_floors
          arguments:
            expression: "total_living_area = main_living_area + upper_living_area + fin_attic_area"
          config:
            severity: warn

    columns:
      # District parcels must be not null and have exactly 14 characters
      - name: dp
        data_type: string
        constraints:
          - type: not_null
          - type: foreign_key
            to: ref('stg_parcels')
            to_columns: [dp]
            warn_unenforced: false

        data_tests:
          - not_null
          - dbt_expectations.expect_column_value_lengths_to_equal:
              arguments:
                value: 14

          - relationships:
              arguments:
                to: ref('stg_parcels')
                field: dp

      # Dates are always YYYY-MM-DD once cast; the raw format is checked on the source.
      - name: sale_date
        data_type: date
        constraints:
          - type: not_null
        data_tests:
          - not_null

      - name: book
        data_type: int64
        constraints:
          - type: not_null

      - name: pg
        data_type: int64
        constraints:
          - type: not_null

      - name: instrument
        data_type: string

      - name: price
        data_type: int64
        constraints:
          - type: not_null
        data_tests:
          - not_null

      - name: seller
        data_type: string

      - name: buyer
        data_type: string

      - name: land_full
        data_type: int64

      - name: bldg_full
        data_type: int64

      - name: total_full
        data_type: int64

      - name: quality1
        data_type: string

      - name: quality2
        data_type: string

      - name: analysis_quality
        data_type: string

      - name: dps
        data_type: string

      - name: gps
        data_type: string

      - name: land_sf
        data_type: numeric(38, 9)

      - name: land_acres
        data_type: numeric(38, 9)

      - name: occupancy
        data_type: string

      - name: residence_type
        data_type: string

      - name: bldg_style
        data_type: string

      - name: exterior_wall_type
        data_type: string

      - name: percent_brick
        data_type: numeric(38, 9)

      - name: roof_type
        data_type: string

      - name: roof_material
        data_type: string

      - name: main_living_area
        data_type: numeric(38, 9)

      - name: upper_living_area
        data_type: numeric(38, 9)

      - name: fin_attic_area
        data_type: numeric(38, 9)

      - name: total_living_area
        data_type: numeric(38, 9)

      - name: unfin_attic_area
        data_type: numeric(38, 9)

      - name: foundation
        data_type: string

      - name: basement_area
        data_type: numeric(38, 9)

      - name: fin_bsmt_area_tot
        data_type: numeric(38, 9)

      - name: bsmt_walkout
        data_type: numeric(38, 9)

      - name: bsmt_gar_capacity
        data_type: int64

      - name: att_garage_area
        data_type: numeric(38, 9)

      - name: garage_brick
        data_type: numeric(38, 9)

      - name: open_porch_area
        data_type: numeric(38, 9)

      - name: enclose_porch_area
        data_type: numeric(38, 9)

      - name: patio_area
        data_type: numeric(38, 9)

      - name: deck_area
        data_type: numeric(38, 9)

      - name: canopy_area
        data_type: numeric(38, 9)

      - name: veneer_area
        data_type: numeric(38, 9)

      - name: carport_area
        data_type: numeric(38, 9)

      - name: fin_bsmt_area1
        data_type: numeric(38, 9)

      - name: fin_bsmt_qual1
        data_type: string

      - name: fin_bsmt_area2
        data_type: numeric(38, 9)

      - name: fin_bsmt_qual2
        data_type: string

      - name: bathrooms
        data_type: int64

      - name: toilet_rooms
        data_type: int64

      - name: extra_fixtures
        data_type: int64

      - name: whirlpools
        data_type: int64

      - name: hottubs
        data_type: int64

      - name: saunas
        data_type: int64

      - name: fireplaces
        data_type: int64

      - name: bedrooms
        data_type: int64

      - name: rooms
        data_type: int64

      - name: families
        data_type: numeric(38, 9)

      - name: year_built
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              name: stg_sale_data__year_built_is_4_digits
              arguments:
                min_value: 1000
                max_value: 9999
              config:
                severity: warn

      - name: year_remodel
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              name: stg_sale_data__year_remodel_is_4_digits
              arguments:
                min_value: 1000
                max_value: 9999
              config:
                severity: warn

      - name: eff_year_built
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              name: stg_sale_data__eff_year_built_is_4_digits
              arguments:
                min_value: 1000
                max_value: 9999
              config:
                severity: warn

      - name: condition
        data_type: string

      - name: grade
        data_type: string

      - name: heating
        data_type: string

      - name: air_conditioning
        data_type: numeric(38, 9)

      - name: percent_complete
        data_type: numeric(38, 9)

      - name: condo_fin_liv_area
        data_type: numeric(38, 9)

      - name: condo_year_built
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              name: stg_sale_data__condo_year_built_is_4_digits
              arguments:
                min_value: 1000
                max_value: 9999
              config:
                severity: warn

      - name: detached_structs
        data_type: string

      - name: initial_entry_date
        data_type: date

      - name: yr
        data_type: int64
        data_tests:
          - not_null:
              name: stg_sale_data__yr_not_null
              config:
                severity: warn
          - dbt_utils.accepted_range:
              name: stg_sale_data__yr_is_4_digits
              arguments:
                min_value: 1000
                max_value: 9999
              config:
                severity: warn

  - name: stg_parcels
    config:
      contract:
        enforced: true

    data_tests:
      # Format checks use dbt_utils.expression_is_true so store_failures keeps the whole failing row.
      - dbt_utils.expression_is_true:
          name: stg_parcels__gp_is_12_digits
          arguments:
            expression: "REGEXP_CONTAINS(gp, r'^[0-9]{12}$')"
          config:
            severity: warn

      - dbt_utils.expression_is_true:
          name: stg_parcels__zip_is_5_digits
          arguments:
            expression: "REGEXP_CONTAINS(zip, r'^[0-9]{5}$')"
          config:
            severity: warn

    columns:
      - name: dp
        data_type: string
        constraints:
          - type: not_null
          - type: primary_key
            warn_unenforced: false

        data_tests:
          - unique
          - dbt_expectations.expect_column_value_lengths_to_equal:
              arguments:
                value: 14

      - name: gp
        data_type: string

        data_tests:
          - dbt_expectations.expect_column_value_lengths_to_equal:
              arguments:
                value: 12

      - name: jurisdiction
        data_type: string

        data_tests:
          - not_null:
              name: stg_parcels__jurisdiction_not_null
              config:
                severity: warn

      - name: zip
        data_type: string

      - name: nbhd
        data_type: string

      - name: pocket
        data_type: string

      - name: address
        data_type: string

      - name: school_district
        data_type: string

        data_tests:
          - not_null:
              name: stg_parcels__school_district_not_null
              config:
                severity: warn

      - name: platname
        data_type: string

      - name: parcel_descriptions
        data_type: string
