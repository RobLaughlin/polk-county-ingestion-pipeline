models:
  - name: stg_sale_data
    description: >-
      One row per recorded sale document (book and page), from raw.sales_raw. Every string is
      trimmed and blanks become NULL. Numbers and dates are cast strictly, so a value that can't
      be cast fails the build instead of becoming NULL. The parcel's location columns are in
      stg_district_parcels.
    config:
      contract:
        enforced: true

    constraints:
      - type: primary_key
        columns: [book, pg]
        warn_unenforced: false

    data_tests:
      # Ensure (book, pg) is a unique compound key
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - book
              - pg

      # Checks use dbt_utils.expression_is_true so store_failures keeps the whole failing row.
      - dbt_utils.expression_is_true:
          name: stg_sale_data__yr_matches_sale_date
          arguments:
            expression: "yr = EXTRACT(YEAR FROM sale_date)"
          config:
            severity: warn

      - dbt_utils.expression_is_true:
          name: stg_sale_data__total_full_is_land_plus_bldg
          arguments:
            expression: "total_full = land_full + bldg_full"
          config:
            severity: warn

      - dbt_utils.expression_is_true:
          name: stg_sale_data__total_living_area_is_sum_of_floors
          arguments:
            expression: "total_living_area = main_living_area + upper_living_area + fin_attic_area"
          config:
            severity: warn

    columns:
      # District parcels must be not null and have exactly 14 characters
      - name: dp
        description: "District/parcel number: the 14-digit property ID, e.g. 01000001000000. The first 3 digits are the district. Kept as text because leading zeros matter. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        config:
          meta:
            source_table: rsale
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale
            inferred: false
        data_type: string
        constraints:
          - type: not_null
          - type: foreign_key
            to: ref('stg_district_parcels')
            to_columns: [dp]
            warn_unenforced: false

        data_tests:
          - not_null
          - dbt_expectations.expect_column_value_lengths_to_equal:
              arguments:
                value: 14

          - relationships:
              arguments:
                to: ref('stg_district_parcels')
                field: dp

      # Dates are always YYYY-MM-DD once cast; the raw format is checked on the source.
      - name: sale_date
        description: "Date the parties signed the deed or contract, as entered from the Declaration of Value. This is the signing date, not the recording date. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        config:
          meta:
            source_table: rsale
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale
            inferred: false
        data_type: date
        constraints:
          - type: not_null
        data_tests:
          - not_null

      - name: book
        description: "Recorder's book number for the recorded document. Book numbers rise over time. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        config:
          meta:
            source_table: rsale
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale
            inferred: false
        data_type: int64
        constraints:
          - type: not_null

      - name: pg
        description: "Recorder's page number within the book. Together, book and pg identify one recorded document. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        config:
          meta:
            source_table: rsale
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale
            inferred: false
        data_type: int64
        constraints:
          - type: not_null

      - name: instrument
        description: "Document type: Deed or Contract. Neither the assessor nor the Iowa Department of Revenue uses contract sales for analysis. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        config:
          meta:
            source_table: rsale
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale
            inferred: false
        data_type: string

      - name: price
        description: "Price paid for the real property only (the total paid minus any personal property), in whole dollars. Token prices such as 0, 1 or 10 are common on non-market transfers. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        config:
          meta:
            source_table: rsale
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale
            inferred: false
        data_type: int64
        constraints:
          - type: not_null
        data_tests:
          - not_null

      - name: seller
        description: "Seller (grantor). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        config:
          meta:
            source_table: rsale
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale
            inferred: false
        data_type: string

      - name: buyer
        description: "Buyer (grantee). | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        config:
          meta:
            source_table: rsale
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale
            inferred: false
        data_type: string

      - name: land_full
        description: "Full assessed value of the land at the time of sale, in whole dollars. The value is as of January 1 of that assessment year, including Board of Review changes. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        config:
          meta:
            source_table: rsale
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale
            inferred: false
        data_type: int64

      - name: bldg_full
        description: "Full assessed value of the buildings at the time of sale, in whole dollars, as of January 1 of that assessment year. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        config:
          meta:
            source_table: rsale
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale
            inferred: false
        data_type: int64

      - name: total_full
        description: "Full assessed value of the land and buildings together at the time of sale, in whole dollars. It should equal land plus buildings. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        config:
          meta:
            source_table: rsale
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale
            inferred: false
        data_type: int64

      - name: quality1
        description: "First Iowa Department of Revenue sale condition: the reason, if any, the sale isn't a normal market sale, e.g. Family or Foreclosure. Arms Length means no condition. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        config:
          meta:
            source_table: rsale
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale
            inferred: false
        data_type: string

      - name: quality2
        description: "Second sale condition, for sales with two conditions. No Code means no second condition. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        config:
          meta:
            source_table: rsale
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale
            inferred: false
        data_type: string

      - name: analysis_quality
        description: "Whether the assessor uses the sale in its own market analysis, such as comparable sales: Good means used and Bad means not used. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        config:
          meta:
            source_table: rsale
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale
            inferred: false
        data_type: string

      - name: dps
        description: "Every parcel in the sale, in short form: the district, then the parcel parts without leading zeros, so 18101588000000 becomes 181/1588. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        config:
          meta:
            source_table: rsale
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale
            inferred: false
        data_type: string

      - name: gps
        description: "Every geoparcel in the sale: the same as gp for a one-parcel sale, otherwise a comma-separated list. | (inferred from data)"
        config:
          meta:
            inferred: true
        data_type: string

      - name: land_sf
        description: "Land area in square feet. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=slandtotal"
        config:
          meta:
            source_table: slandtotal
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=slandtotal
            inferred: false
        data_type: numeric(38, 9)

      - name: land_acres
        description: "Land area in acres, to 3 decimal places. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=slandtotal"
        config:
          meta:
            source_table: slandtotal
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=slandtotal
            inferred: false
        data_type: numeric(38, 9)

      - name: occupancy
        description: "Kind of dwelling, e.g. Single Family, Townhouse or Condominium. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        config:
          meta:
            source_table: residence
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence
            inferred: false
        data_type: string

      - name: residence_type
        description: "Number of stories and type of attic, e.g. 1 Story, 1.5 Stories or Split Foyer. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        config:
          meta:
            source_table: residence
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence
            inferred: false
        data_type: string

      - name: bldg_style
        description: "Architectural style, e.g. Conventional, Ranch or Cape Cod. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        config:
          meta:
            source_table: residence
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence
            inferred: false
        data_type: string

      - name: exterior_wall_type
        description: "Main exterior wall material, e.g. Vinyl Siding, Brick or Wood Siding. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        config:
          meta:
            source_table: residence
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence
            inferred: false
        data_type: string

      - name: percent_brick
        description: "Percent of the house exterior that is full-height brick, 0 to 100. Brick on only the front wall is counted in the veneer area instead. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        config:
          meta:
            source_table: residence
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence
            inferred: false
        data_type: numeric(38, 9)

      - name: roof_type
        description: "Roof shape: Gable, Hip, Flat, Gambrel, Mansard, Shed or Other. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        config:
          meta:
            source_table: residence
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence
            inferred: false
        data_type: string

      - name: roof_material
        description: "Roof covering, e.g. Asphalt Shingle, Metal or Wood Shingle. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        config:
          meta:
            source_table: residence
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence
            inferred: false
        data_type: string

      - name: main_living_area
        description: "Finished living area on the main floor, in square feet, measured from the building sketch. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        config:
          meta:
            source_table: residence
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence
            inferred: false
        data_type: numeric(38, 9)

      - name: upper_living_area
        description: "Finished living area above the main floor, in square feet. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        config:
          meta:
            source_table: residence
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence
            inferred: false
        data_type: numeric(38, 9)

      - name: fin_attic_area
        description: "Finished attic area, in square feet. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        config:
          meta:
            source_table: residence
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence
            inferred: false
        data_type: numeric(38, 9)

      - name: total_living_area
        description: "Main floor, upper floors and finished attic together, in square feet, measured on exterior dimensions to ANSI standards. It should equal the sum of those three areas. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        config:
          meta:
            source_table: residence
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence
            inferred: false
        data_type: numeric(38, 9)

      - name: unfin_attic_area
        description: "Unfinished attic reached by stairs and used for storage, in square feet. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        config:
          meta:
            source_table: residence
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence
            inferred: false
        data_type: numeric(38, 9)

      - name: foundation
        description: "Foundation material, e.g. Poured Concrete, Concrete Block or Brick. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        config:
          meta:
            source_table: residence
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence
            inferred: false
        data_type: string

      - name: basement_area
        description: "Total basement area, finished or not, in square feet. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        config:
          meta:
            source_table: residence
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence
            inferred: false
        data_type: numeric(38, 9)

      - name: fin_bsmt_area_tot
        description: "Total finished basement area, in square feet. It should equal the first and second finished areas added together. | (inferred from data)"
        config:
          meta:
            inferred: true
        data_type: numeric(38, 9)

      - name: bsmt_walkout
        description: "Length of walkout (fully exposed) basement wall, in linear feet. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        config:
          meta:
            source_table: residence
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence
            inferred: false
        data_type: numeric(38, 9)

      - name: bsmt_gar_capacity
        description: "Number of garage stalls in the basement. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        config:
          meta:
            source_table: residence
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence
            inferred: false
        data_type: int64

      - name: att_garage_area
        description: "Attached garage area, in square feet. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        config:
          meta:
            source_table: residence
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence
            inferred: false
        data_type: numeric(38, 9)

      - name: garage_brick
        description: "Percent of the attached garage exterior that is brick, 0 to 100. A percent, not an area. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        config:
          meta:
            source_table: residence
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence
            inferred: false
        data_type: numeric(38, 9)

      - name: open_porch_area
        description: "Open or screened porch area, in square feet. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        config:
          meta:
            source_table: residence
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence
            inferred: false
        data_type: numeric(38, 9)

      - name: enclose_porch_area
        description: "Three-season porch or breezeway area, in square feet. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        config:
          meta:
            source_table: residence
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence
            inferred: false
        data_type: numeric(38, 9)

      - name: patio_area
        description: "Patio area, in square feet. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        config:
          meta:
            source_table: residence
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence
            inferred: false
        data_type: numeric(38, 9)

      - name: deck_area
        description: "Wood deck area, in square feet. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        config:
          meta:
            source_table: residence
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence
            inferred: false
        data_type: numeric(38, 9)

      - name: canopy_area
        description: "Metal canopy area, in square feet. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        config:
          meta:
            source_table: residence
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence
            inferred: false
        data_type: numeric(38, 9)

      - name: veneer_area
        description: "Area of brick on the front wall or part of a wall, in square feet. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        config:
          meta:
            source_table: residence
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence
            inferred: false
        data_type: numeric(38, 9)

      - name: carport_area
        description: "Carport area, in square feet. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence"
        config:
          meta:
            source_table: residence
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=residence
