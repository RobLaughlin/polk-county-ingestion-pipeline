  - name: stg_district_parcels
    description: >-
      One row per district parcel (dp), from raw.sales_raw. Each column takes its value from the
      parcel's most recent sale: the latest sale_date, then the highest book and page. Strings
      are trimmed and blanks become NULL. Legal descriptions are in stg_geo_parcels, by gp.
    config:
      contract:
        enforced: true

    data_tests:
      # Format checks use dbt_utils.expression_is_true so store_failures keeps the whole failing row.
      - dbt_utils.expression_is_true:
          name: stg_district_parcels__gp_is_12_digits
          arguments:
            expression: "REGEXP_CONTAINS(gp, r'^[0-9]{12}$')"
          config:
            severity: warn

      - dbt_utils.expression_is_true:
          name: stg_district_parcels__zip_is_5_digits
          arguments:
            expression: "REGEXP_CONTAINS(zip, r'^[0-9]{5}$')"
          config:
            severity: warn

    columns:
      - name: dp
        description: "District/parcel number: the 14-digit property ID, e.g. 01000001000000. The first 3 digits are the district. Kept as text because leading zeros matter. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        config:
          meta:
            source_table: rsale
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale
            inferred: false
        data_type: string
        constraints:
          - type: not_null
          - type: primary_key
            warn_unenforced: false

        data_tests:
          - unique
          - dbt_expectations.expect_column_value_lengths_to_equal:
              arguments:
                value: 14

      - name: gp
        description: "Geoparcel number, 12 digits, e.g. 802434255001. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=xysall"
        config:
          meta:
            source_table: xysall
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=xysall
            inferred: false
        data_type: string

        data_tests:
          - dbt_expectations.expect_column_value_lengths_to_equal:
              arguments:
                value: 12

      - name: jurisdiction
        description: "City or township the parcel is in, e.g. ANKENY or ALLEN TWNSHP. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=districts"
        config:
          meta:
            source_table: districts
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=districts
            inferred: false
        data_type: string

        data_tests:
          - not_null:
              name: stg_district_parcels__jurisdiction_not_null
              config:
                severity: warn

      - name: zip
        description: "Zip code of the property sold. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        config:
          meta:
            source_table: rsale
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale
            inferred: false
        data_type: string

      - name: nbhd
        description: "Assessor neighborhood code, 4 characters, e.g. AK02. nbhd and pocket together identify a neighborhood. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=nbhds"
        config:
          meta:
            source_table: nbhds
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=nbhds
            inferred: false
        data_type: string

      - name: pocket
        description: "Sub-area of the neighborhood, 2 characters, e.g. G3. nbhd and pocket together identify a neighborhood. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=nbhds"
        config:
          meta:
            source_table: nbhds
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=nbhds
            inferred: false
        data_type: string

      - name: address
        description: "Street address of the property sold. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale"
        config:
          meta:
            source_table: rsale
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=rsale
            inferred: false
        data_type: string

      - name: school_district
        description: "School district the parcel is in, e.g. Ankeny. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=parcel"
        config:
          meta:
            source_table: parcel
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=parcel
            inferred: false
        data_type: string

        data_tests:
          - not_null:
              name: stg_district_parcels__school_district_not_null
              config:
                severity: warn

      - name: platname
        description: "Name of the recorded plat (subdivision) the parcel is in, e.g. WHITE BIRCH PLAT 1. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=plats"
        config:
          meta:
            source_table: plats
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=plats
            inferred: false
        data_type: string

  - name: stg_geo_parcels
    description: >-
      One row per geoparcel (gp) named anywhere in raw.sales_raw: in gp, gps or
      legal_all_parcels. legal_all_parcels holds one 'gp: description' entry per parcel,
      separated by ###, and each parcel keeps the description from the most recent sale that
      lists it. Strings are trimmed and blanks become NULL.
    config:
      contract:
        enforced: true

    columns:
      - name: gp
        description: "Geoparcel number, 12 digits, e.g. 802434255001. | Every gp named in gp, gps or legal_all_parcels, once each. | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=xysall"
        config:
          meta:
            source_table: xysall
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=xysall
            inferred: false
        data_type: string
        constraints:
          - type: not_null
          - type: primary_key
            warn_unenforced: false

        data_tests:
          - unique
          - dbt_expectations.expect_column_value_lengths_to_equal:
              arguments:
                value: 12

      - name: parcel_description
        description: "Legal description of the parcel, e.g. 'LT 8 EAST POLK PLAT 2'. NULL when no sale's legal_all_parcels lists the parcel. | Split from legal_all_parcels: the text after 'gp:' in the parcel's entry, from the most recent sale that lists it. | (inferred from data; the source page only labels the field) | Source: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=legal"
        config:
          meta:
            source_table: legal
            source_url: https://www.assess.co.polk.ia.us/cgi-bin/web/tt/infoqry.cgi?tt=info/help/tables/table_all&table=legal
            inferred: true
        data_type: string
