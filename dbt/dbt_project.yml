name: polk_county
version: "1.0.0"
config-version: 2
profile: polk_county

model-paths: ["models"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]

# Each folder builds into its own BigQuery dataset (see macros/generate_schema_name.sql).
# Terraform creates these datasets (dbt_datasets in terraform/gcp.tf), so add new names in both places.
models:
  polk_county:
    staging:
      +schema: staging
    intermediate:
      +schema: intermediate
    marts:
      dims:
        +schema: marts_dims
      facts:
        +schema: marts_facts

# Every model test stores its failing rows in an audit dataset next to the models it tests.
data_tests:
  polk_county:
    staging:
      +schema: staging_audit
      +store_failures: true
    intermediate:
      +schema: intermediate_audit
      +store_failures: true
    marts:
      dims:
        +schema: marts_dims_audit
        +store_failures: true
      facts:
        +schema: marts_facts_audit
        +store_failures: true

seeds:
  polk_county:
    +schema: seeds
