# Turns the Polk County Assessor's residential sales export (raw.sales_raw) into a star schema:
#
#   raw.sales_raw -> staging -> intermediate -> marts (dims and facts)
#
# - staging: typed, trimmed copies of the raw table (stg_sale_data, stg_district_parcels, stg_geo_parcels).
# - intermediate: cleanup and coding (int_sales, int_district_parcels).
# - marts: fct_sales and its dimensions, including the code lookups built from seeds/.
#
# Each folder's YAML describes its models and every column: what it means, what that model or an
# earlier one did to it, and its source page. Staging also keeps each column's source in meta.
# View them with: dbt docs generate && dbt docs serve
name: polk_county
version: "1.0.0"
config-version: 2
profile: polk_county

model-paths: ["models"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]

# Each folder builds into its own BigQuery dataset (see macros/generate_schema_name.sql).
# Terraform creates these datasets (dbt_datasets in terraform/gcp.tf), so add new names in both places.
models:
  polk_county:
    # Copy model and column descriptions onto the BigQuery tables and columns.
    +persist_docs:
      relation: true
      columns: true
    staging:
      +schema: staging
    intermediate:
      +schema: intermediate
    marts:
      dims:
        +schema: marts_dims
      facts:
        +schema: marts_facts

# Every model test stores its failing rows in an audit dataset next to the models it tests.
data_tests:
  polk_county:
    staging:
      +schema: staging_audit
      +store_failures: true
    intermediate:
      +schema: intermediate_audit
      +store_failures: true
    marts:
      dims:
        +schema: marts_dims_audit
        +store_failures: true
      facts:
        +schema: marts_facts_audit
        +store_failures: true

# The valid_* code lists, loaded by dbt seed. The dim_* lookups in marts/dims select from them.
seeds:
  polk_county:
    +persist_docs:
      relation: true
      columns: true
    +schema: seeds
