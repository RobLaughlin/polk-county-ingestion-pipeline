[project]
name = "polk-county-ingestion"
version = "0.1.0"
description = "Residential sales ingestion for Polk County, Iowa."
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-cloud-bigquery>=3.46.1",
    "google-cloud-storage>=3.17.0",
    "lazy-table>=0.2.1",
    "requests>=2.34.2",
    "tabulate>=0.10.0",
]

[tool.uv]
package = false

# Keep this app independent of any surrounding uv workspace.
[tool.uv.workspace]
members = []
